[package]
name = "amd-ext-d3d"
version = "0.4.1"
authors = ["Traverse Research <support@traverseresearch.nl>"]
edition = "2021"
rust-version = "1.95"
license = "MIT"
homepage = "https://traverseresearch.nl"
repository = "https://github.com/Traverse-Research/amd-ext-d3d-rs"
description = "Rust bindings for AMD's DirectX12 modified PIX3 RGP markers"
include = ["src", "LICENSE"]

[package.metadata.docs.rs]
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "i686-pc-windows-msvc",
]

[dependencies]
anyhow = "1.0.3"
# Provides every D3D12 type that the AMD extension interfaces reference. The generated bindings
# `use d3d12_agility::*` instead of emitting their own copies, so they share type identity with
# all other crates built on `d3d12-agility`.
d3d12-agility = { git = "https://github.com/Traverse-Research/d3d12-agility-rs", rev = "873651e" }
libloading = "0.8"
# Autogenerated bindings reference `::windows_core`. Must be the same (semver-compatible) version
# that `d3d12-agility` is built on, so that `IUnknown`, `Interface`, `GUID`, ... are shared.
windows-core = "0.100"

[workspace]
members = ["api_gen"]
