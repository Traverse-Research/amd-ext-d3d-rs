on:
  push:
  pull_request:

jobs:
  rust:
    name: Lint Rust code
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cargo test
        run: cargo test --workspace

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      # Test minimal versions to ensure our version specifiers in Cargo.toml
      # define a correct lower-bound.
      - name: Generate lockfile with minimal dependency versions
        run: cargo +nightly generate-lockfile -Zminimal-versions

      - name: Cargo clippy with minimal-versions
        # Exclude api_gen because it does not need to build on minimum versions.
        run: cargo +stable clippy --workspace --exclude api_gen --all-targets -- -D warnings

  rust-msrv:
    name: Build-test MSRV (1.95) with minimal crate dependencies
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - name: Generate minimal-version dependencies
        run: cargo -Zminimal-versions generate-lockfile
      # Pass the MSRV as an input rather than as the action ref, which Dependabot would "bump".
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Cargo check
        run: cargo check --workspace --exclude api_gen --all-targets

  generate:
    name: Verify generated bindings are up to date
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate bindings
        run: cargo run -p api_gen
      - name: Diff generated files
        shell: bash
        run: test -z "$(git status --porcelain)" || (echo "::error::Generated files are different, please regenerate with cargo run -p api_gen!"; git status; git diff; false)
